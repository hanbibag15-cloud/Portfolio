<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호식이두마리치킨리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../Font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css?v=30">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
                <header class="site-header">
            <div class="header-inner">
                <h1 class="header-logo">
                    <a href="index.html" aria-label="호식이두마리치킨 홈">
                        <img src="img/log.png" alt="호식이두마리치킨">
                    </a>
                </h1>

                <nav class="header-nav" id="header-nav" aria-label="주요 메뉴">
                    <ul>
                        <li class="has-submenu">
                            <a href="#menu" aria-expanded="false" aria-controls="mobile-submenu">메뉴</a>
                            <ul class="header-submenu" id="mobile-submenu" aria-label="메뉴 상세">
                                <li><a href="#all-menu">전체 메뉴</a></li>
                                <li><a href="#chicken-menu">치킨 메뉴</a></li>
                                <li><a href="#parts-menu">부위별 메뉴</a></li>
                                <li><a href="#side-menu">사이드 메뉴</a></li>
                            </ul>
                        </li>
                        <li><a href="#brand">브랜드</a></li>
                        <li><a href="#stores">매장찾기</a></li>
                        <li><a href="#events">이벤트</a></li>
                    </ul>
                </nav>

                <div class="header-utils">
                    <a href="#franchise">
                        <img src="img/store 2.svg" alt="">
                        <span>창업안내</span>
                    </a>
                    <span class="header-utils-divider" aria-hidden="true"></span>
                    <a href="#gift-card">
                        <img src="img/ticket 2.svg" alt="">
                        <span>상품권</span>
                    </a>
                </div>

                <button class="header-menu-toggle" type="button" aria-label="메뉴 열기" aria-controls="header-nav" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper visual">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide">
                            <img src="img/vlsual01.png" alt="맵시크치킨배너" class="pc">
                            <img src="img/m_vlsual01.jpg?v=e0479c61" alt="모바일맵시크치킨배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/vlsual02.png" alt="수라깐풍치킨배너" class="pc">
                            <img src="img/m_vlsual02.jpg?v=54672407" alt="모바일수라깐풍치킨배너" class= "mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/vlsual03.png?v=ba0c692b" alt="세 번째 치킨 프로모션 배너" class="pc">
                            <img src="img/m_vlsual03.png?v=7ba61503" alt="세 번째 치킨 모바일 프로모션 배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/vlsual04.png?v=5affe127" alt="네 번째 치킨 프로모션 배너" class="pc">
                            <img src="img/m_vlsual04.png?v=e21f9d76" alt="네 번째 치킨 모바일 프로모션 배너" class="mo">
                        </div>
                    </div>
                    <!-- Hero pagination: 실제 슬라이드 개수에 맞춰 생성 -->
                    <div class="swiper-pagination"></div>

                    <!-- Hero navigation -->
                    <div class="swiper-button-prev" aria-label="이전 배너"></div>
                    <div class="swiper-button-next" aria-label="다음 배너"></div>

                </div>
            </div>
            <section class="menu-section" id="menu" aria-labelledby="menu-section-title">
                <div class="menu-section-heading">
                    <h2 id="menu-section-title">MENU</h2>
                    <p>두 마리의 즐거움, 다양한 맛의 선택</p>
                </div>

                <div class="menu-category-tabs" role="group" aria-label="상품 분류">
                    <button type="button" class="menu-category is-active" data-menu-type="chicken" aria-pressed="true">치킨 메뉴</button>
                    <button type="button" class="menu-category" data-menu-type="side" aria-pressed="false">사이드 메뉴</button>
                </div>

                <div class="menu-feature" data-menu-panel="chicken">
                    <button type="button" class="menu-feature-arrow menu-feature-prev" aria-label="이전 상품"></button>
                    <div class="menu-feature-products" aria-live="polite">
                        <div class="menu-feature-product is-prev" data-product-index="0">
                            <div class="menu-product-image"><img src="img/chicken_img02.png?v=a208e4b7" alt="딥블랙갈릭 치킨"></div>
                            <div class="menu-product-caption" hidden>
                                <span class="menu-product-new">NEW</span>
                                <h3>딥블랙갈릭 치킨</h3>
                            </div>
                        </div>
                        <div class="menu-feature-product is-active" data-product-index="1">
                            <div class="menu-product-image"><img src="img/chicken_img01.png?v=6c7591a1" alt="깐쇼킹 치킨"></div>
                            <div class="menu-product-caption">
                                <span class="menu-product-new">NEW</span>
                                <h3>깐쇼킹 치킨</h3>
                            </div>
                        </div>
                        <div class="menu-feature-product is-next" data-product-index="2">
                            <div class="menu-product-image"><img src="img/chicken_img03.png?v=3d77b515" alt="맵시크 치킨"></div>
                            <div class="menu-product-caption" hidden>
                                <span class="menu-product-new">NEW</span>
                                <h3>맵시크 치킨</h3>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="menu-feature-arrow menu-feature-next" aria-label="다음 상품"></button>
                </div>
                <p class="menu-side-notice" data-menu-panel="side" hidden>사이드 메뉴 이미지를 추가하면 이곳에 표시됩니다.</p>
            </section>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
    const menuToggle = document.querySelector('.header-menu-toggle');
    const siteHeader = document.querySelector('.site-header');
    menuToggle.addEventListener('click', () => {
        const isOpen = siteHeader.classList.toggle('menu-open');
        menuToggle.setAttribute('aria-expanded', String(isOpen));
        menuToggle.setAttribute('aria-label', isOpen ? '메뉴 닫기' : '메뉴 열기');
    });
    const menuMainLink = document.querySelector('.has-submenu > a');
    const submenuContainer = document.querySelector('.has-submenu');

    menuMainLink.addEventListener('click', (event) => {
        if (window.matchMedia('(max-width: 1024px)').matches) {
            event.preventDefault();
            const isOpen = submenuContainer.classList.toggle('submenu-open');
            menuMainLink.setAttribute('aria-expanded', String(isOpen));
        }
    });

    document.querySelectorAll('.header-nav a').forEach(link => {
        link.addEventListener('click', (event) => {
            if (link === menuMainLink && window.matchMedia('(max-width: 1024px)').matches) return;
            submenuContainer.classList.remove('submenu-open');
            menuMainLink.setAttribute('aria-expanded', 'false');
            siteHeader.classList.remove('menu-open');
            menuToggle.setAttribute('aria-expanded', 'false');
            menuToggle.setAttribute('aria-label', '메뉴 열기');
        });
    });

    const menuItems = document.querySelectorAll('.menu-feature-product');
    let activeMenuIndex = 1;

    function updateFeaturedMenu() {
        menuItems.forEach((item, index) => {
            item.classList.remove('is-prev', 'is-active', 'is-next');
            const distance = (index - activeMenuIndex + menuItems.length) % menuItems.length;
            item.classList.add(distance === 0 ? 'is-active' : distance === 1 ? 'is-next' : 'is-prev');
            const caption = item.querySelector('.menu-product-caption');
            if (caption) caption.hidden = distance !== 0;
        });
    }

    document.querySelector('.menu-feature-prev').addEventListener('click', () => {
        activeMenuIndex = (activeMenuIndex - 1 + menuItems.length) % menuItems.length;
        updateFeaturedMenu();
    });
    document.querySelector('.menu-feature-next').addEventListener('click', () => {
        activeMenuIndex = (activeMenuIndex + 1) % menuItems.length;
        updateFeaturedMenu();
    });

    document.querySelectorAll('.menu-category').forEach(button => {
        button.addEventListener('click', () => {
            const isChicken = button.dataset.menuType === 'chicken';
            document.querySelectorAll('.menu-category').forEach(tab => {
                const selected = tab === button;
                tab.classList.toggle('is-active', selected);
                tab.setAttribute('aria-pressed', String(selected));
            });
            document.querySelector('[data-menu-panel="chicken"]').hidden = !isChicken;
            document.querySelector('[data-menu-panel="side"]').hidden = isChicken;
        });
    });

    const swiper = new Swiper('.hero-sec > .swiper', {
        // Optional parameters
        direction: 'horizontal',
        loop: true,
        speed: 600,
        autoplay: {
            delay: 3000,
            disableOnInteraction: false,
            pauseOnMouseEnter: true,
        },

        // If we need pagination
        pagination: {
            el: '.visual .swiper-pagination',
            clickable: true,
        },

        // Navigation arrows
        navigation: {
            nextEl: '.visual .swiper-button-next',
            prevEl: '.visual .swiper-button-prev',
        },
    });
    </script>
</body>
</html>
