<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Font/css/pretendardvariable.css">
    <link rel="stylesheet" href="login.css">
    <link id="active-theme-css" rel="stylesheet" href="maximalism.css">
    <link rel="stylesheet" href="theme-picker.css">

    <title>NAVER 로그인 UI 3</title>
</head>
<body>
    <div id="wrap" class="state_page maximalism">
        <header>
            <button type="button" class="back_btn" aria-label="뒤로가기"></button>

            <h1 class="logo">
                <img src="img/naver_icon 1.svg" alt="NAVER">
                <span>로그인</span>
            </h1>
        </header>

        <main>
            <section class="login">
                <h2 class="sr-only">NAVER 로그인</h2>

                <form action="">
                    <fieldset>
                        <legend class="sr-only">로그인 정보 입력</legend>

                        <div class="state_input_group">
                            <label for="id_3">아이디 또는 전화번호</label>
                            <input
                                type="text"
                                id="id_3"
                                name="id"
                                value="demo@example.com"
                                autocomplete="username"
                            >
                        </div>

                        <div class="state_input_group">
                            <label for="password_3">비밀번호</label>
                            <div class="password_input">
                                <input
                                    type="password"
                                    id="password_3"
                                    name="password"
                                    value="example123"
                                    autocomplete="current-password"
                                >
                                <button type="button" class="password_view" aria-label="비밀번호 보기">
                                    <img src="img/eye_icon (1).svg" alt="">
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="login_btn">로그인</button>

                        <button type="button" class="passkey_btn">
                            <img src="img/Passkey.svg" alt="">
                            <span>패스키 로그인</span>
                        </button>
                    </fieldset>
                </form>

                <nav class="login_links" aria-label="로그인 관련 메뉴">
                    <a href="#">아이디 찾기</a>
                    <a href="#">비밀번호 찾기</a>
                    <a href="#">회원가입</a>
                </nav>
            </section>
        </main>
    </div>
    <details class="theme-picker" open>
        <summary>🎨 디자인 테마</summary>
        <ul aria-label="로그인 디자인 테마 목록">
            <li><button type="button" data-theme="original" aria-pressed="false">원본 NAVER</button></li>
            <li><button type="button" data-theme="neo-brutalism" aria-pressed="false">Neo Brutalism</button></li>
            <li><button type="button" data-theme="y2k-chrome" aria-pressed="false">Y2K Chrome</button></li>
            <li><button type="button" data-theme="pixel-art" aria-pressed="false">Pixel Art</button></li>
            <li><button type="button" data-theme="collage" aria-pressed="false">Collage</button></li>
            <li><button type="button" data-theme="art-deco" aria-pressed="false">Art Deco</button></li>
            <li><button type="button" data-theme="cyberpunk" aria-pressed="false">Cyberpunk</button></li>
            <li><button type="button" data-theme="memphis" aria-pressed="false">Memphis</button></li>
            <li><button type="button" data-theme="glassmorphism" aria-pressed="false">Glassmorphism</button></li>
            <li><button type="button" data-theme="swiss-style" aria-pressed="false">Swiss Style</button></li>
            <li><button type="button" data-theme="bento-grid" aria-pressed="false">Bento Grid</button></li>
            <li><button type="button" data-theme="editorial" aria-pressed="false">Editorial</button></li>
            <li><button type="button" data-theme="minimalism" aria-pressed="false">Minimalism</button></li>
            <li><button type="button" data-theme="claymorphism" aria-pressed="false">Claymorphism</button></li>
            <li><button type="button" data-theme="maximalism" aria-pressed="false">Maximalism</button></li>
        </ul>
    </details>
    <script src="theme-picker.js" defer></script>
</body>
</html>
